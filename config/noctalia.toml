[bar.default]
center = [ "spacer_5", "group:g3", "spacer_6", "group:g2" ]
end = [ "group:g4", "spacer_4", "group:g1" ]
margin_ends = 0
position = "left"
radius = 18
scale = 1.4000000134110451
start = [ "group:g6", "workspaces", "spacer_2", "group:g5" ]
thickness = 50

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "battery", "session" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "media", "control-center" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g6"
    members = [ "launcher", "spacer_3", "notifications" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "recorder", "clock" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 233.0
    cy = 400.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        bands = 32
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 238.5
    cy = 285.5
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background_color = "on_primary"
        center_text = false
        clock_style = "digital"
        color = "tertiary"
        font_family = "Bebas Neue"
        format = "{:%H:%M:%S}"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 238.5
    cy = 215.5
    output = "eDP-1"
    rotation = 0.0
    type = "label"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        description = ""
        font_family = "Bebas Neue"
        opacity = 1.0
        title = "son😭"

[dock]
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 683.0
    cy = 649.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[notification]
offset_x = 0
offset_y = 0

[plugin_settings."noctalia/screen_recorder"]
filename_pattern = "recording_%Y-%m-%d_at_%Hh%Mm%Ss"
video_source = "focused"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell.screen_corners]
enabled = true

[shell.screenshot]
directory = "/home/niver/Pictures/Screenshots"

[theme]
builtin = "Ayu"
community_palette = "Tokyo Night Moon"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "foot", "gtk4", "hyprland", "qt" ]
    community_ids = [ "neovim", "fuzzel", "antigravity", "bat", "lazygit", "prismlauncher", "yazi" ]

[wallpaper]
directory = "/home/niver/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/niver/Pictures/wallpapers/tahoe-dark.png"

    [wallpaper.last]
    path = "/home/niver/Pictures/wallpapers/tahoe-dark.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/niver/Pictures/wallpapers/tahoe-dark.png"

[widget.clock]
capsule = true
format = "%H:%M"

[widget.launcher]
capsule = true
color = "tertiary"
glyph = "brand-dribbble-filled"

[widget.network]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.spacer_2]
length = 10
type = "spacer"

[widget.spacer_3]
length = 10
type = "spacer"

[widget.spacer_4]
length = 50
type = "spacer"

[widget.spacer_5]
length = 10
type = "spacer"

[widget.spacer_6]
length = 10
type = "spacer"

[widget.workspaces]
capsule = true
hide_when_empty = true
style = "focus_hint"
